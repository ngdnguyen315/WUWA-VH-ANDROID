name: Sync PAK Files

on:
  #schedule:
    # Chạy mỗi 30 phút (lệch giờ để tránh quá tải server Github)
    # Cập nhật lại lịch cron
    #- cron: '12,42 * * * *'
  workflow_dispatch:
    # Cho phép chạy thủ công

permissions:
  contents: write

jobs:
  sync-pak:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DANGDEV_TOKEN: ${{ secrets.DANGDEV_TOKEN }}
      DANGDEV_API_URL: ${{ secrets.DANGDEV_API_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # ─────────────────────────────────────────────
      # 1. WuWaVHCN_99_P.pak 
      # ─────────────────────────────────────────────
      - name: Check CN pak update time
        id: cn
        run: |
          VERSION_JSON=$(curl -sL "https://huggingface.co/datasets/BachMacThanh/DangDevVH/raw/main/Wuwa/version.json")
          TAG=$(echo "$VERSION_JSON" | jq -r '.version' | sed 's/^v//i')
          
          DATASET_API=$(curl -sL "https://huggingface.co/api/datasets/BachMacThanh/DangDevVH/commits/main?path=Wuwa/version.json")
          UPDATED_UTC=$(echo "$DATASET_API" | jq -r '.[0].date')
          UPDATED=$(TZ='Asia/Ho_Chi_Minh' date -d "$UPDATED_UTC" +"%Y-%m-%dT%H:%M:%S.000Z")

          echo "tag=$TAG"       >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "CN: tag=v$TAG | updated_at=$UPDATED"

          # Đọc dữ liệu đã lưu
          CACHE=".github/pak_versions/cn_updated_at.txt"
          OLD_TIME=$([ -f "$CACHE" ] && head -n 1 "$CACHE" || echo "")
          OLD_TAG=$([ -f "$CACHE" ] && sed -n '2p' "$CACHE" || echo "")
          echo "old_time=$OLD_TIME" >> $GITHUB_OUTPUT
          echo "old_tag=$OLD_TAG" >> $GITHUB_OUTPUT
          echo "CN cached: $OLD_TIME | tag=$OLD_TAG"

      - name: Download WuWaVHCN_99_P.pak
        if: steps.cn.outputs.updated != steps.cn.outputs.old_time || steps.cn.outputs.tag != steps.cn.outputs.old_tag || steps.cn.outputs.old_time == ''
        run: |
          echo "🔄 CN pak thay đổi lúc ${{ steps.cn.outputs.updated }} (cũ: ${{ steps.cn.outputs.old_time }})"
          DOWNLOAD_URL=$(curl -sL -X POST "${{ env.DANGDEV_API_URL }}" \
            -H "Authorization: Bearer ${{ env.DANGDEV_TOKEN }}" \
            -H "X-Client-Platform: android" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -d "{\"box\":\"WuwaVH\",\"provider\":\"mod\",\"version\":\"${{ steps.cn.outputs.tag }}\"}" | jq -r '.href')
            
          if [ "$DOWNLOAD_URL" != "null" ] && [ -n "$DOWNLOAD_URL" ]; then
            curl -L "$DOWNLOAD_URL" -o "WuWaVHCN_99_P.pak"
          else
            echo "❌ Lỗi: Không thể lấy link tải WuWa từ DangDev!"
            exit 1
          fi
          echo "✅ Tải xong: $(du -sh WuWaVHCN_99_P.pak | cut -f1)"

          mkdir -p .github/pak_versions
          echo "${{ steps.cn.outputs.updated }}" > .github/pak_versions/cn_updated_at.txt
          echo "${{ steps.cn.outputs.tag }}" >> .github/pak_versions/cn_updated_at.txt
          echo "CN_TAG=${{ steps.cn.outputs.tag }}" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 2. WuWaVHEN_99_P.pak 
      # ─────────────────────────────────────────────
      - name: Check EN repo update time
        id: en
        run: |
          COMMITS=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Lai-Hoang/wuwa-viet-hoa/commits?sha=main&path=TiengViet_99_P&per_page=1")

          COMMIT_MSG=$(echo "$COMMITS" | jq -r '.[0].commit.message' | head -n 1 | tr -d "\"'\`")
          UPDATED_UTC=$(echo "$COMMITS" | jq -r '.[0].commit.committer.date')
          UPDATED=$(TZ='Asia/Ho_Chi_Minh' date -d "$UPDATED_UTC" +"%Y-%m-%dT%H:%M:%S.000Z")

          echo "tag=$COMMIT_MSG"         >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "EN: commit_msg=$COMMIT_MSG | updated_at=$UPDATED"

          # Đọc thời gian đã lưu
          CACHE=".github/pak_versions/en_updated_at.txt"
          OLD_TIME=$([ -f "$CACHE" ] && head -n 1 "$CACHE" || echo "")
          echo "old_time=$OLD_TIME" >> $GITHUB_OUTPUT
          echo "EN cached: $OLD_TIME"

      - name: Build WuWaVHEN_99_P.pak
        if: steps.en.outputs.updated != steps.en.outputs.old_time || steps.en.outputs.old_time == ''
        run: |
          echo "🔄 EN repo thay đổi lúc ${{ steps.en.outputs.updated }} (cũ: ${{ steps.en.outputs.old_time }})"
          
          echo "🔄 Clone Lai-Hoang/wuwa-viet-hoa..."
          git clone --depth 1 https://github.com/Lai-Hoang/wuwa-viet-hoa.git /tmp/wuwa-en-vi
          
          echo "🗑️ Filtering directories, keeping only ConfigDB and UidShow..."
          mkdir -p /tmp/pack_stage/Client/Content/Aki/JavaScript/Game/Module
          cp -r /tmp/wuwa-en-vi/TiengViet_99_P/Client/Content/Aki/ConfigDB /tmp/pack_stage/Client/Content/Aki/
          cp -r /tmp/wuwa-en-vi/TiengViet_99_P/Client/Content/Aki/JavaScript/Game/Module/UidShow /tmp/pack_stage/Client/Content/Aki/JavaScript/Game/Module/
          
          echo "📥 Installing wine to run the Windows repak tool from repo..."
          sudo apt-get update && sudo apt-get install -y wine
          
          echo "📦 Packing TiengViet_99_P using author's repak.exe (uncompressed)..."
          wine "/tmp/wuwa-en-vi/helpPakFile/Pak File unpacker + packer mod/repak/repak.exe" pack -v --version V12 /tmp/pack_stage -- WuWaVHEN_99_P.pak
          
          echo "✅ Đã tạo xong: $(du -sh WuWaVHEN_99_P.pak | cut -f1)"

          mkdir -p .github/pak_versions
          echo "${{ steps.en.outputs.updated }}" > .github/pak_versions/en_updated_at.txt
          echo "${{ steps.en.outputs.tag }}" >> .github/pak_versions/en_updated_at.txt
          echo 'EN_TAG<<EOF' >> $GITHUB_ENV
          echo "${{ steps.en.outputs.tag }}" >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # ─────────────────────────────────────────────
      # 3. NTEVH_99_P.pak 
      # ─────────────────────────────────────────────
      - name: Check NTE update time
        id: nte
        run: |
          VERSION_JSON=$(curl -sL "https://huggingface.co/datasets/BachMacThanh/DangDevVH/raw/main/NTE/version.json")
          TAG=$(echo "$VERSION_JSON" | jq -r '.version' | sed 's/^v//i')
          
          DATASET_API=$(curl -sL "https://huggingface.co/api/datasets/BachMacThanh/DangDevVH/commits/main?path=NTE/version.json")
          UPDATED_UTC=$(echo "$DATASET_API" | jq -r '.[0].date')
          UPDATED=$(TZ='Asia/Ho_Chi_Minh' date -d "$UPDATED_UTC" +"%Y-%m-%dT%H:%M:%S.000Z")

          echo "tag=$TAG"       >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "NTE: tag=$TAG | updated_at=$UPDATED"

          # Đọc dữ liệu đã lưu
          CACHE=".github/pak_versions/nte_updated_at.txt"
          OLD_TIME=$([ -f "$CACHE" ] && head -n 1 "$CACHE" || echo "")
          OLD_TAG=$([ -f "$CACHE" ] && sed -n '2p' "$CACHE" || echo "")
          echo "old_time=$OLD_TIME" >> $GITHUB_OUTPUT
          echo "old_tag=$OLD_TAG" >> $GITHUB_OUTPUT
          echo "NTE cached: $OLD_TIME | tag=$OLD_TAG"

      - name: Build NTEVH_99_P.pak
        if: steps.nte.outputs.updated != steps.nte.outputs.old_time || steps.nte.outputs.tag != steps.nte.outputs.old_tag || steps.nte.outputs.old_time == ''
        run: |
          echo "🔄 Tạo bản từ BachMacThanh NTE..."
          if [ ! -d "/tmp/wuwa-en-vi" ]; then
            git clone --depth 1 https://github.com/Lai-Hoang/wuwa-viet-hoa.git /tmp/wuwa-en-vi
            sudo apt-get update && sudo apt-get install -y wine unzip
          fi
          
          echo "📥 Lấy link tải và Downloading NTE_VietHoa_Android.zip..."
          DOWNLOAD_URL=$(curl -sL -X POST "${{ env.DANGDEV_API_URL }}" \
            -H "Authorization: Bearer ${{ env.DANGDEV_TOKEN }}" \
            -H "X-Client-Platform: android" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -d "{\"box\":\"NTEVH\",\"provider\":\"android\",\"version\":\"${{ steps.nte.outputs.tag }}\"}" | jq -r '.href')
            
          if [ "$DOWNLOAD_URL" != "null" ] && [ -n "$DOWNLOAD_URL" ]; then
            curl -L "$DOWNLOAD_URL" -o "NTE_Android.zip"
          else
            echo "❌ Lỗi: Không thể lấy link tải NTE từ DangDev!"
            exit 1
          fi
          
          echo "📦 Extracting Zip..."
          unzip -q NTE_Android.zip -d NTE_Extracted
          
          PAK_FILE=$(find NTE_Extracted -name "*.pak" | head -n 1)
          if [ -z "$PAK_FILE" ]; then
            echo "❌ Không tìm thấy file .pak trong file Zip!"
            exit 1
          fi
          
          echo "📦 Unpacking $PAK_FILE..."
          wine "/tmp/wuwa-en-vi/helpPakFile/Pak File unpacker + packer mod/repak/repak.exe" unpack "$PAK_FILE"
          
          UNPACKED_DIR="${PAK_FILE%.pak}"
          
          echo "🔠 Trích xuất Font sang thư mục fonts/ để đồng bộ..."
          python3 -c "
          import struct, glob, os
          font_dir = '$UNPACKED_DIR/HT/Content/Environment/Building/TrainStation/Fonts'
          out_dir = 'fonts'
          os.makedirs(out_dir, exist_ok=True)
          for f in glob.glob(os.path.join(font_dir, 'MiSans-Heavy.ufont')):
              name = os.path.basename(f).replace('.ufont', '_extracted.ttf')
              with open(f, 'rb') as in_f: data = in_f.read()
              length = struct.unpack('<I', data[:4])[0]
              with open(os.path.join(out_dir, name), 'wb') as out_f:
                  out_f.write(data[4:4+length])
              print(f'Extracted {name}')
          "
          
          echo "🗑️ Xóa toàn bộ thư mục Environment (bao gồm Fonts)..."
          rm -rf "$UNPACKED_DIR/HT/Content/Environment" 2>/dev/null || true
          
          echo "📦 Repacking to NTEVH_99_P.pak..."
          wine "/tmp/wuwa-en-vi/helpPakFile/Pak File unpacker + packer mod/repak/repak.exe" pack -v --version V11 "$UNPACKED_DIR" -- NTEVH_99_P.pak
          
          echo "✅ Đã tạo xong bản NoFont: $(du -sh NTEVH_99_P.pak | cut -f1)"

          mkdir -p .github/pak_versions
          echo "${{ steps.nte.outputs.updated }}" > .github/pak_versions/nte_updated_at.txt
          echo "${{ steps.nte.outputs.tag }}" >> .github/pak_versions/nte_updated_at.txt
          echo "NTE_TAG=${{ steps.nte.outputs.tag }}" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 4. Commit & Push
      # ─────────────────────────────────────────────
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add WuWaVHCN_99_P.pak WuWaVHEN_99_P.pak NTEVH_99_P.pak .github/pak_versions/ 2>/dev/null || true
          git add fonts/MiSans-Heavy_extracted.ttf 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✅ Không có thay đổi, bỏ qua commit."
          else
            MSG="🤖 Auto-sync PAK"
            [ -n "${CN_TAG}" ] && MSG="$MSG | CN: ${CN_TAG} (${{ steps.cn.outputs.updated }})"
            [ -n "${EN_TAG}" ] && MSG="$MSG | EN: ${EN_TAG} (${{ steps.en.outputs.updated }})"
            [ -n "${NTE_TAG}" ] && MSG="$MSG | NTE: ${NTE_TAG} (${{ steps.nte.outputs.updated }})"
            git commit -m "$MSG"
            git push
            echo "✅ Pushed: $MSG"
            echo "PUSHED=true" >> $GITHUB_ENV
          fi

      - name: Send Firebase Notifications
        if: env.PUSHED == 'true'
        env:
          NOTIFY_KEY: ${{ secrets.NOTIFY_KEY }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_NOTIFY: ${{ secrets.TEST_NOTIFY }}
        run: |
          echo "⏳ Đợi 5 phút trước khi gửi thông báo..."
          sleep 300
          echo "Cài đặt thư viện Python..."
          pip3 install requests google-auth --break-system-packages
          echo "Chạy script thông báo..."
          cat << 'EOF' > /tmp/send_notify.py
          import os, sys, json, time, urllib.request, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          NOTIFY_URL = os.environ.get("NOTIFY_URL", "").strip()
          DATABASE_URL = os.environ.get("DATABASE_URL", "").strip()

          def get_access_token(service_account_json_str):
              try:
                  creds_dict = json.loads(service_account_json_str)
                  credentials = service_account.Credentials.from_service_account_info(
                      creds_dict,
                      scopes=[
                          "https://www.googleapis.com/auth/firebase.messaging",
                          "https://www.googleapis.com/auth/firebase.database",
                          "https://www.googleapis.com/auth/userinfo.email"
                      ]
                  )
                  request = Request()
                  credentials.refresh(request)
                  return credentials.token
              except Exception as e:
                  print(f"Error getting access token: {e}")
                  return None

          def get_hf_version_note(path):
              try:
                  url = f"https://huggingface.co/datasets/BachMacThanh/DangDevVH/raw/main/{path}/version.json"
                  req = urllib.request.Request(url)
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode('utf-8'))
                      return data.get('note', '')
              except Exception as e:
                  print(f"Error fetching version note from {path}: {e}")
                  return ""

          def send_notification(token, title, body, target_token=None):
              timestamp = int(time.time() * 1000)
              message = {
                  "notification": {"title": title, "body": body},
                  "android": {
                      "priority": "high",
                      "ttl": "86400s",
                      "notification": {"channel_id": "wuwa_vh_channel"}
                  },
                  "data": {
                      "timestamp": str(timestamp),
                      "title": title,
                      "body": body
                  }
              }
              if target_token:
                  message["token"] = target_token
              else:
                  message["topic"] = "all"

              payload = {"message": message}
              headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json; UTF-8"}
              
              res_notify = requests.post(NOTIFY_URL, headers=headers, json=payload)
              if res_notify.status_code != 200:
                  print(f"Lỗi gửi thông báo: {res_notify.status_code} - {res_notify.text}")
              else:
                  print("Gửi thông báo thành công!")
                  
              db_payload = {"title": title, "body": body, "timestamp": timestamp, "target": target_token if target_token else "all"}
              db_url = f"{DATABASE_URL}?access_token={token}"
              res_db = requests.post(db_url, json=db_payload)
              if res_db.status_code != 200:
                  print(f"Lỗi lưu Database: {res_db.status_code} - {res_db.text}")
              else:
                  print("Lưu Database thành công!")

          def main():
              service_account_str = os.environ.get("NOTIFY_KEY")
              if not service_account_str:
                  print("Không có NOTIFY_KEY. Bỏ qua gửi thông báo.")
                  return

              cn_tag = os.environ.get("CN_TAG", "")
              en_tag = os.environ.get("EN_TAG", "")
              nte_tag = os.environ.get("NTE_TAG", "")

              if not cn_tag and not en_tag and not nte_tag:
                  return

              token = get_access_token(service_account_str)
              if not token:
                  print("Không thể lấy token.")
                  sys.exit(1)

              test_token = os.environ.get("TEST_NOTIFY")

              def dispatch(title, body):
                  if test_token:
                      print("Gửi thông báo CHỈ TEST tới token cố định...")
                      send_notification(token, "[TEST] " + title, body, target_token=test_token)
                  else:
                      print("Gửi thông báo tới tất cả người dùng...")
                      send_notification(token, title, body)

              if en_tag:
                  dispatch(f"Cập nhật bản dịch EN-VI WW {en_tag}", f"Cập nhật bản dịch EN-VI WW {en_tag}")

              if cn_tag:
                  note = get_hf_version_note("Wuwa")
                  dispatch(f"Cập nhật bản dịch CN-VI WW {cn_tag}", note if note else f"Cập nhật bản dịch CN-VI WW {cn_tag}")

              if nte_tag:
                  note = get_hf_version_note("NTE")
                  dispatch(f"Cập nhật bản dịch NTE {nte_tag}", note if note else f"Cập nhật bản dịch NTE {nte_tag}")

          if __name__ == "__main__":
              main()
          EOF
          python3 /tmp/send_notify.py
