name: Sync PAK Files

on:
  schedule:
    # Chạy mỗi 2 giờ để kiểm tra update
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Cho phép chạy thủ công

permissions:
  contents: write

jobs:
  sync-pak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # ─────────────────────────────────────────────
      # 1. WuWaVHCN_99_P.pak (CallMeDangDev/WuwaVH)
      # ─────────────────────────────────────────────
      - name: Check CN pak update time
        id: cn
        run: |
          RELEASE=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/CallMeDangDev/WuwaVH/releases/latest)

          TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          UPDATED=$(echo "$RELEASE" | jq -r '.assets[] | select(.name == "WuWaVH_99_P.pak") | .updated_at')

          echo "tag=$TAG"       >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "CN: tag=$TAG | updated_at=$UPDATED"

          # Đọc thời gian đã lưu
          CACHE=".github/pak_versions/cn_updated_at.txt"
          OLD_TIME=$([ -f "$CACHE" ] && cat "$CACHE" || echo "")
          echo "old_time=$OLD_TIME" >> $GITHUB_OUTPUT
          echo "CN cached: $OLD_TIME"

      - name: Download WuWaVHCN_99_P.pak
        if: steps.cn.outputs.updated != steps.cn.outputs.old_time || steps.cn.outputs.old_time == ''
        run: |
          echo "🔄 CN pak thay đổi lúc ${{ steps.cn.outputs.updated }} (cũ: ${{ steps.cn.outputs.old_time }})"
          curl -L \
            "https://github.com/CallMeDangDev/WuwaVH/releases/latest/download/WuWaVH_99_P.pak" \
            -o "WuWaVHCN_99_P.pak"
          echo "✅ Tải xong: $(du -sh WuWaVHCN_99_P.pak | cut -f1)"

          mkdir -p .github/pak_versions
          echo "${{ steps.cn.outputs.updated }}" > .github/pak_versions/cn_updated_at.txt
          echo "CN_TAG=${{ steps.cn.outputs.tag }}" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 2. WuWaVHEN_99_P.pak (Lai-Hoang/wuwa-viet-hoa)
      # ─────────────────────────────────────────────
      - name: Check EN pak update time
        id: en
        run: |
          RELEASE=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Lai-Hoang/wuwa-viet-hoa/releases/latest)

          TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          ZIP_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("tieng.?viet.?ww.?EN_to_Vi"; "i")) | .browser_download_url' | head -n1)
          ZIP_NAME=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("tieng.?viet.?ww.?EN_to_Vi"; "i")) | .name' | head -n1)
          UPDATED=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("tieng.?viet.?ww.?EN_to_Vi"; "i")) | .updated_at' | head -n1)

          echo "tag=$TAG"         >> $GITHUB_OUTPUT
          echo "zip_url=$ZIP_URL" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "EN: tag=$TAG | file=$ZIP_NAME | updated_at=$UPDATED"

          # Đọc thời gian đã lưu
          CACHE=".github/pak_versions/en_updated_at.txt"
          OLD_TIME=$([ -f "$CACHE" ] && cat "$CACHE" || echo "")
          echo "old_time=$OLD_TIME" >> $GITHUB_OUTPUT
          echo "EN cached: $OLD_TIME"

      - name: Download and extract WuWaVHEN_99_P.pak
        if: steps.en.outputs.updated != steps.en.outputs.old_time || steps.en.outputs.old_time == ''
        run: |
          ZIP_URL="${{ steps.en.outputs.zip_url }}"
          if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
            echo "❌ Không tìm thấy file zip EN_to_Vi trong release!"
            curl -sL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Lai-Hoang/wuwa-viet-hoa/releases/latest \
              | jq -r '.assets[].name'
            exit 1
          fi

          echo "🔄 EN pak thay đổi lúc ${{ steps.en.outputs.updated }} (cũ: ${{ steps.en.outputs.old_time }})"
          curl -L "$ZIP_URL" -o /tmp/vn_pack.zip
          echo "✅ Tải xong: $(du -sh /tmp/vn_pack.zip | cut -f1)"

          mkdir -p /tmp/vn_extract
          unzip -o /tmp/vn_pack.zip -d /tmp/vn_extract

          PAK=$(find /tmp/vn_extract -name "TiengViet_99_P.pak" | head -n1)
          if [ -z "$PAK" ]; then
            echo "❌ Không tìm thấy TiengViet_99_P.pak trong zip!"
            find /tmp/vn_extract -type f
            exit 1
          fi

          cp "$PAK" "WuWaVHEN_99_P.pak"
          echo "✅ Sao chép xong: $(du -sh WuWaVHEN_99_P.pak | cut -f1)"

          mkdir -p .github/pak_versions
          echo "${{ steps.en.outputs.updated }}" > .github/pak_versions/en_updated_at.txt
          echo "EN_TAG=${{ steps.en.outputs.tag }}" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 3. Commit & Push
      # ─────────────────────────────────────────────
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add WuWaVHCN_99_P.pak WuWaVHEN_99_P.pak .github/pak_versions/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✅ Không có thay đổi, bỏ qua commit."
          else
            MSG="🤖 Auto-sync PAK"
            [ -n "${CN_TAG}" ] && MSG="$MSG | CN: ${CN_TAG} (${{ steps.cn.outputs.updated }})"
            [ -n "${EN_TAG}" ] && MSG="$MSG | EN: ${EN_TAG} (${{ steps.en.outputs.updated }})"
            git commit -m "$MSG"
            git push
            echo "✅ Pushed: $MSG"
          fi
